[project]
name = "adu"
version = "0.1.0"
description = "Screen Bethesda, MD parcels for where a detached ADU fits."
readme = "README.md"
authors = [
    { name = "Edward OBrien" }
]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "markdown>=3.11.3",
    "numpy>=2.4.6",
    "pyarrow>=26.0.1",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

adu_size_cap_ratio: 0.75
adu_size_cap_citation: "Ch. 59 §3.3.3.A.1 as amended by Ord. 20-36 (ZTA 26-06, adopted 2026-09-15, effective 2026-10-05): an ADU is 'not greater than 75% of the size of' the primary single-family detached dwelling; the old detached cap (least of 50% of house footprint, 10% of lot, 1,200 sf) was repealed. Implements Md. HB 1466 (2025, Ch. 197). https://assets.montgomerycountymd.gov/files/2026-09/Ordinance%2020-36%20%28ZTA%2026-06%29.pdf"
sfd_codes:
  # MD iMap / SDAT Parcel Points: LU (land use) and STRUBLDG (building type).
  land_use: ["R"]          # Residential
  structure: ["0001", "0004", "0005"]   # DWEL Standard Unit, Split Foyer, Split Level
  citation: "SDAT codes as decoded by MD iMap Parcel Points fields DESCLU/DESCBLDG (LU 'R' = Residential; STRUBLDG 0001 Standard Unit, 0004 Split Foyer, 0005 Split Level; 0002/0003 are townhouse end/center units, 0007-0009 condos, 0006 mobile home). Cross-checked 2026-11-08: in the county property layer every parcel with county land use 111 'Single Family Detached' in the study envelope has dwelling type x001/x004/x005, and no townhouse code. https://mdgeodata.md.gov/imap/rest/services/PlanningCadastre/MD_PropertyData/MapServer/0"
corner_lot_front: "shorter"
corner_lot_citation: "Ch. 59 §1.4.2 'Lot Line, Front': 'On a corner lot, the owner must elect which lot line is the front lot line.' The code fixes no rule, so 'shorter' is a screening heuristic (most houses face the shorter frontage). Unconfirmed; see notes. https://codelibrary.amlegal.com/codes/montgomerycounty/latest/montgomeryco_md_zone2014/0-0-0-60"

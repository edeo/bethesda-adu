# Per-zone detached-ADU rules for Bethesda ZCTAs 20814 / 20816 / 20817.
# Researched 2026-11-08. Full sources, conditions and simplifications:
#   docs/research/regulatory-notes.md
#
# Legal basis: a detached ADU "must comply with the setback, height, and building
# lot coverage standards of an accessory structure in the underlying zone"
# (Ch. 59 §3.3.3.A.2.c.v, as amended by Ord. 20-36 / ZTA 26-06, effective 2026-10-05).
# So every setback/height below is the zone's ACCESSORY STRUCTURE standard for the
# detached-house building type (standard method), and coverage_cap is the zone's
# lot coverage max for a detached house (all buildings combined).
#
# Keys must equal the ZONE field of the county zoning layer exactly (it carries the
# CR/CRT/... density suffix). Every ZONE value found in the three ZCTAs on
# 2026-11-08 is listed; anything else is treated as zone_ineligible downstream.
#
# Conventions:
#   setbacks_ft.front        distance from front lot line (accessory front setback)
#   setbacks_ft.side/rear    value for an ADU 15'-20' tall where the zone adds 2 ft of
#                            side/rear setback per foot of height over 15 ft
#                            (R-60, R-90, R-40); i.e. base 5' + 10' = 15'. See notes.
#   setbacks_ft.side_street  the larger of the zone's two side-street cases
#   behind_front_line        ADU must not sit between the front lot line and the house
#   behind_rear_building_line (extra) ADU must be wholly behind the rear wall of the
#                            house (stricter than behind_front_line). Pipeline must
#                            enforce this for these zones; see notes.
#   front_building_line_offset_ft (extra) ADU must be this far behind the front
#                            wall of the house (zones whose accessory front setback is
#                            written as "N' behind front building line").
#   missing_sdat_not_sfd (extra) mixed-use zones (CR*, CRT*, CRN*, GR*, NR*, EOF*): a
#                            parcel with no SDAT land use AND no structure code is not
#                            a house. Pilot: of 152 mixed-use parcels all 67 with SDAT
#                            were not_sfd and all 85 without were construction/non-houses.
#   confidence (extra)       confirmed = read from current Ch. 59 text; unconfirmed =
#                            best-sourced value needing user check.

